[versions]
# Build toolchain
agp = "9.2.1"
kotlin = "2.3.10"
ksp = "2.3.6"

# Compose and navigation
composeBom = "2026.06.00"
navigation = "2.9.8"
androidxHilt = "1.3.0"

# AndroidX core
coreKtx = "1.18.0"
activityKtx = "1.13.0"
lifecycle = "2.9.4"
annotation = "1.9.1"

# Async and dependency injection
coroutines = "1.9.0"
hilt = "2.59.2"
guava = "33.3.1-android"

# Code quality and coverage
ktlintGradle = "14.2.0"
detekt = "2.0.0-alpha.5"
jacoco = "0.8.15"

# Testing
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
testRunner = "1.7.0"
testRules = "1.7.0"
coroutinesTest = "1.9.0"
truth = "1.4.4"
turbine = "1.2.1"
# Keep Macrobenchmark and the Baseline Profile Gradle plugin aligned. This line
# supports the AGP 9.2 toolchain used by the application.
benchmark = "1.5.0-alpha07"
profileInstaller = "1.4.1"
uiautomator = "2.3.0"

# Ui library
bmaterial = "1.3.1"

[libraries]
# Gradle plugin classpath artifacts used by build-logic
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { group = "org.jetbrains.kotlin.plugin.compose", name = "org.jetbrains.kotlin.plugin.compose.gradle.plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradle-plugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
ktlint-gradle-plugin = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlintGradle" }
detekt-gradle-plugin = { group = "dev.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }

# AndroidX foundation and lifecycle
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }

# Jetpack Compose. Library versions without version.ref are managed by the BOM.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Kotlin coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Dependency injection
dagger-hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
dagger-hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
guava-android = { group = "com.google.guava", name = "guava", version.ref = "guava" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "testRules" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileInstaller" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

# Ui library
bmaterial-ui-core-tokens = { group = "com.b231001.bmaterial", name = "ui-core-tokens", version.ref = "bmaterial" }
bmaterial-ui-core-resources = { group = "com.b231001.bmaterial", name = "ui-core-resources", version.ref = "bmaterial" }
bmaterial-ui-core-foundation = { group = "com.b231001.bmaterial", name = "ui-core-foundation", version.ref = "bmaterial" }
bmaterial-ui-components-button = { group = "com.b231001.bmaterial", name = "ui-components-button", version.ref = "bmaterial" }
bmaterial-ui-components-card = { group = "com.b231001.bmaterial", name = "ui-components-card", version.ref = "bmaterial" }
bmaterial-ui-components-chip = { group = "com.b231001.bmaterial", name = "ui-components-chip", version.ref = "bmaterial" }
bmaterial-ui-components-dialog = { group = "com.b231001.bmaterial", name = "ui-components-dialog", version.ref = "bmaterial" }
bmaterial-ui-components-listitem = { group = "com.b231001.bmaterial", name = "ui-components-listitem", version.ref = "bmaterial" }
bmaterial-ui-components-scrollbar = { group = "com.b231001.bmaterial", name = "ui-components-scrollbar", version.ref = "bmaterial" }
bmaterial-ui-components-slider = { group = "com.b231001.bmaterial", name = "ui-components-slider", version.ref = "bmaterial" }
bmaterial-ui-components-switch = { group = "com.b231001.bmaterial", name = "ui-components-switch", version.ref = "bmaterial" }
bmaterial-ui-components-text = { group = "com.b231001.bmaterial", name = "ui-components-text", version.ref = "bmaterial" }
bmaterial-ui-components-textfield = { group = "com.b231001.bmaterial", name = "ui-components-textfield", version.ref = "bmaterial" }

[plugins]
# Android and Kotlin
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

# Compose and code generation
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# Dependency injection
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# Code quality
detekt = { id = "dev.detekt", version.ref = "detekt" }
